name: Bug Report
description: Report an infrastructure defect or incident-related issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report infrastructure defects. For production incidents, follow the incident response runbook and open a PagerDuty incident in parallel.

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev
        - staging
        - production
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Terraform / AWS
        - EKS / Kubernetes
        - Helm charts
        - CI/CD pipelines
        - Monitoring / alerting
        - Secrets management
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? Include error messages, timestamps, and affected services (payments-api, fraud-engine, merchant-portal).
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands, Terraform targets, or workflow runs that reproduce the issue.

  - type: textarea
    id: impact
    attributes:
      label: Customer / business impact
      description: Is customer traffic affected? Estimated blast radius.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have included relevant logs or Terraform plan output
          required: false
