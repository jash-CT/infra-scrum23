name: Feature Request
description: Propose a new infrastructure capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What capability is missing or what pain point does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the infrastructure change, including affected environments and services.
    validations:
      required: true

  - type: dropdown
    id: environments
    attributes:
      label: Target environments
      multiple: true
      options:
        - dev
        - staging
        - production
    validations:
      required: true

  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance considerations
      options:
        - label: PCI DSS impact assessment required
        - label: SOC 2 control mapping required
        - label: Security team review required

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches evaluated and why they were not selected.
