name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'tests/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  bootstrap:
    name: Validate remote state bootstrap (SCRUM-23)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive .

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Remote state contract tests
        working-directory: .
        run: python -m unittest discover -s tests/terraform -p 'test_*.py' -v

  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: bootstrap
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/te-github-actions-terraform
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..
        working-directory: terraform/environments/${{ matrix.environment }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -var-file=terraform.tfvars -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const planPath = 'terraform/environments/${{ matrix.environment }}/plan.txt';
            const raw = fs.readFileSync(planPath, 'utf8');
            const plan = execSync('python scripts/redact_terraform_plan.py', {
              input: raw,
              encoding: 'utf8',
            });
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const body = `### Terraform Plan — \`${{ matrix.environment }}\`\n\`\`\`\n${truncated}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1
