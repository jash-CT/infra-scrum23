apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "merchant-portal.fullname" . }}
  labels:
    {{- include "merchant-portal.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  PORT: {{ .Values.config.httpPort | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  PAYMENTS_API_URL: {{ .Values.config.paymentsApiUrl | quote }}
  NEXTAUTH_URL: {{ .Values.config.nextAuthUrl | quote }}
