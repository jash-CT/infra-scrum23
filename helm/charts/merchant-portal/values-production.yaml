replicaCount: 2

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/te-prod-merchant-portal-role

ingress:
  hosts:
    - host: portal.transactedge.com
      paths:
        - path: /
          pathType: Prefix

config:
  environment: production
  paymentsApiUrl: https://api.transactedge.com/v1
  nextAuthUrl: https://portal.transactedge.com

externalSecrets:
  remoteSecretName: te-prod/merchant-portal
