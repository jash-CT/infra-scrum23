apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fraud-engine.serviceAccountName" . }}
  labels:
    {{- include "fraud-engine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
