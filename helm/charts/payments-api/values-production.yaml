replicaCount: 3

image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/transactedge/payments-api
  tag: latest

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/te-prod-payments-api-role

ingress:
  hosts:
    - host: api.transactedge.com
      paths:
        - path: /v1
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20

config:
  logLevel: info
  environment: production
  kafka:
    brokers: b-1.te-prod-msk.abc123.c2.kafka.us-east-1.amazonaws.com:9098
  database:
    host: te-prod-postgres.abc123.us-east-1.rds.amazonaws.com
  redis:
    host: te-prod-redis.abc123.cache.amazonaws.com

externalSecrets:
  remoteSecretName: te-prod/payments-api
