apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-api.fullname" . }}
  labels:
    {{- include "payments-api.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  HTTP_PORT: {{ .Values.config.httpPort | quote }}
  METRICS_PORT: {{ .Values.config.metricsPort | quote }}
  KAFKA_BROKERS: {{ .Values.config.kafka.brokers | quote }}
  KAFKA_TOPIC_PAYMENTS: {{ .Values.config.kafka.topicPayments | quote }}
  KAFKA_TOPIC_SETTLEMENTS: {{ .Values.config.kafka.topicSettlements | quote }}
  KAFKA_CONSUMER_GROUP: {{ .Values.config.kafka.consumerGroup | quote }}
  DB_HOST: {{ .Values.config.database.host | quote }}
  DB_PORT: {{ .Values.config.database.port | quote }}
  DB_NAME: {{ .Values.config.database.name | quote }}
  DB_SSL_MODE: {{ .Values.config.database.sslMode | quote }}
  DB_MAX_OPEN_CONNS: {{ .Values.config.database.maxOpenConns | quote }}
  DB_MAX_IDLE_CONNS: {{ .Values.config.database.maxIdleConns | quote }}
  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_TLS: {{ .Values.config.redis.tls | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}
