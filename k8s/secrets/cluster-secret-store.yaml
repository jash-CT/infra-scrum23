# External Secrets Operator configuration for TransactEdge workloads.
# Deploy the ClusterSecretStore once per cluster; application charts reference it via ExternalSecret resources.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
