global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: transactedge
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kubernetes-apiservers
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  - job_name: payments-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - payments-api.payments.svc.cluster.local:9090
        labels:
          service: payments-api
          team: payments

  - job_name: fraud-engine
    metrics_path: /metrics
    static_configs:
      - targets:
          - fraud-engine.fraud.svc.cluster.local:9091
        labels:
          service: fraud-engine
          team: risk

  - job_name: merchant-portal
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - merchant-portal.merchant.svc.cluster.local:9092
        labels:
          service: merchant-portal
          team: merchant-experience

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter.monitoring.svc.cluster.local:9308
        labels:
          service: msk

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter.monitoring.svc.cluster.local:9187
        labels:
          service: rds
